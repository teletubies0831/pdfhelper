<dialog
  id="clear-chat-dialog"
  class="app-confirm-dialog clear-chat-dialog"
  aria-labelledby="clear-chat-dialog-title"
  aria-describedby="clear-chat-dialog-description"
>
  <section class="app-confirm-dialog-card">
    <header>
      <div class="app-confirm-dialog-icon" aria-hidden="true">!</div>
      <div>
        <h2 id="clear-chat-dialog-title">清空对话</h2>
        <p id="clear-chat-dialog-description">确定清空当前 PDF 的全部聊天记录吗？清空后无法恢复。</p>
      </div>
      <button id="clear-chat-dialog-close" class="app-confirm-dialog-close" type="button" aria-label="关闭">×</button>
    </header>
    <footer>
      <button id="clear-chat-dialog-cancel" type="button">取消</button>
      <button id="clear-chat-dialog-confirm" class="danger-button" type="button">清空对话</button>
    </footer>
  </section>
</dialog>
