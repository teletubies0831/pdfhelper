<header class="toolbar">
  <button id="outline-toggle" class="toolbar-pill toolbar-nav-button toolbar-outline-button" type="button" title="显示或隐藏左侧目录">
    <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-menu" /></svg>
    目录
  </button>

  <div class="toolbar-menu" data-toolbar-menu>
    <button
      class="toolbar-pill toolbar-menu-trigger toolbar-nav-button toolbar-file-button"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-file" /></svg>
      文件
      <svg class="toolbar-menu-caret" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-chevron-down" /></svg>
    </button>
    <div class="toolbar-menu-panel" role="menu" hidden>
      <div class="toolbar-menu-section">
        <div class="toolbar-menu-heading">文件管理</div>
        <button id="recent-files-button" class="toolbar-menu-item" type="button" role="menuitem">
          <span aria-hidden="true">◷</span>
          最近打开
        </button>
        <label
          id="open-file"
          class="toolbar-menu-item"
          for="file-input"
          role="menuitem"
          tabindex="0"
        >
          <svg class="toolbar-icon open-pdf-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 3.5h7l4 4v13h-11z" />
            <path d="M13.5 3.5v4h4" />
            <path d="M8.8 14.8h6.4" />
            <path d="M8.8 17.2h4.6" />
            <path d="M8.8 10.6h2.1a1.5 1.5 0 0 1 0 3H8.8z" />
          </svg>
          打开 PDF
        </label>
        <button id="save-annotated-pdf" class="toolbar-menu-item primary-button" type="button" role="menuitem">
          <span aria-hidden="true">↓</span>
          保存批注 PDF
        </button>
      </div>
    </div>
  </div>
  <input id="file-input" class="file-input" type="file" accept="application/pdf,.pdf" />

  <div class="toolbar-menu reading-mode-menu" data-toolbar-menu>
    <button
      class="toolbar-pill toolbar-menu-trigger toolbar-nav-button reading-mode-trigger"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
      title="选择当前 PDF 的阅读策略"
    >
      <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-mode" /></svg>
      <span id="reading-mode-trigger-label">通用阅读</span>
      <svg class="toolbar-menu-caret" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-chevron-down" /></svg>
    </button>
    <div class="toolbar-menu-panel reading-mode-menu-panel" role="menu" hidden>
      <div class="toolbar-menu-section">
        <div class="toolbar-menu-heading">阅读模式</div>
        <button class="toolbar-menu-item reading-mode-menu-item" type="button" role="menuitemradio" aria-checked="false" data-reading-mode-value="auto">
          <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-ai" /></svg>
          <span><strong>AI 自动识别</strong><small>根据当前文档自动选择模式</small></span>
        </button>
        <button class="toolbar-menu-item reading-mode-menu-item" type="button" role="menuitemradio" aria-checked="false" data-reading-mode-value="general">
          <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-mode" /></svg>
          <span><strong>通用阅读</strong><small>适合一般资料和技术文档</small></span>
        </button>
        <button class="toolbar-menu-item reading-mode-menu-item" type="button" role="menuitemradio" aria-checked="false" data-reading-mode-value="paper">
          <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-pdf" /></svg>
          <span><strong>论文精读</strong><small>突出论文结构与研究信息</small></span>
        </button>
        <button class="toolbar-menu-item reading-mode-menu-item" type="button" role="menuitemradio" aria-checked="false" data-reading-mode-value="novel">
          <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-knowledge" /></svg>
          <span><strong>小说阅读</strong><small>侧重原句翻译和语言学习</small></span>
        </button>
      </div>
    </div>
    <select id="reading-mode-select" class="reading-mode-native-select" title="选择当前 PDF 的阅读策略" aria-hidden="true" tabindex="-1">
      <option value="auto">AI 自动识别（通用阅读）</option>
      <option value="general">通用阅读</option>
      <option value="paper">论文精读</option>
      <option value="novel">小说阅读</option>
    </select>
    <button id="detect-reading-mode" type="button" title="重新识别阅读模式" aria-label="重新识别阅读模式">↻</button>
    <small id="reading-mode-status">AI自动 · 通用阅读</small>
  </div>

  <div class="toolbar-group annotation-tools expanded-toolbar-group" aria-label="批注工具">
    <button class="toolbar-nav-button" type="button" data-editor-mode="select" title="选择文字；选择批注后可移动或编辑">
      <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-pointer" /></svg>
      移动/选择
    </button>
    <button class="toolbar-nav-button" type="button" data-editor-mode="highlight" title="选中文字并高亮">
      <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-highlight" /></svg>
      高亮
    </button>
    <label class="highlight-color-control" title="高亮颜色">
      <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-color" /></svg>
      <span>颜色</span>
      <input id="highlight-color" type="color" value="#fff066" />
    </label>
    <button class="toolbar-nav-button" type="button" data-editor-mode="ink" title="自由绘制"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-pen" /></svg>画笔</button>
    <button class="toolbar-nav-button" type="button" data-editor-mode="text" title="在页面上添加文本"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-note" /></svg>批注</button>
    <button id="erase-selected-annotation" class="toolbar-nav-button" type="button" title="删除当前选中的批注"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-eraser" /></svg>擦除</button>
    <button id="undo-annotation" class="toolbar-nav-button" type="button" title="撤销批注"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-undo" /></svg>撤销</button>
    <button id="redo-annotation" class="toolbar-nav-button" type="button" title="重做批注"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-redo" /></svg>重做</button>
    <button id="smart-copy" class="toolbar-nav-button" type="button" title="整理复制选中文本"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-copy" /></svg>整理复制</button>
    <button id="toggle-notes" class="toolbar-nav-button" type="button" title="隐藏/显示所有笔记标记"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-eye-off" /></svg><span data-toggle-notes-label>隐藏笔记</span></button>
  </div>

  <div class="toolbar-group ai-tools expanded-toolbar-group" aria-label="AI 工具">
    <button id="ai-panel-toggle" class="toolbar-pill toolbar-nav-button ai-entry active" type="button">
      <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-pdf" /></svg>
      PDF 阅读
    </button>
    <button id="knowledge-base-entry" class="toolbar-pill toolbar-nav-button" type="button"><svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-knowledge" /></svg>知识卡</button>
  </div>

  <button id="assistant-panel-toggle" class="toolbar-pill toolbar-nav-button assistant-entry active" type="button" title="显示或隐藏右侧 AI 助手">
    <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-ai" /></svg>
    AI 助手
  </button>
  <button
    id="ai-settings-button"
    class="toolbar-icon-button toolbar-settings-button toolbar-nav-button"
    type="button"
    title="AI 设置"
    aria-label="打开 AI 设置"
  >
    <svg class="toolbar-action-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-settings" /></svg>
  </button>
</header>
