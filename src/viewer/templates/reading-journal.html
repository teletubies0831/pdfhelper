<section id="reading-journal-page" class="reading-journal-page" hidden aria-label="阅读札记页面">
        <div class="reading-journal-shell">
          <header class="reading-journal-header">
            <div>
              <button id="reading-journal-back" type="button" aria-label="返回 PDF">←</button>
              <span>
                <strong>阅读札记</strong>
                <small id="reading-journal-document">当前 PDF</small>
              </span>
            </div>
            <button id="reading-journal-new" class="primary-button" type="button">新建札记</button>
          </header>
          <div class="reading-journal-search">
            <input id="reading-journal-search" type="search" placeholder="搜索原文、笔记内容或标签…" />
            <span id="reading-journal-count">0 条札记</span>
          </div>
          <div id="reading-journal-list" class="reading-journal-list"></div>
          <div id="reading-journal-empty" class="reading-journal-empty">
            <strong>还没有阅读札记</strong>
            <p>可在翻译结果或 AI 对话中保存，也可以手动创建 Markdown 札记。</p>
          </div>
        </div>
      </section>

      <div id="reading-journal-editor" class="reading-journal-editor" hidden>
        <form id="reading-journal-form">
          <header>
            <div>
              <strong id="reading-journal-editor-title">新建阅读札记</strong>
              <small id="reading-journal-editor-source"></small>
            </div>
            <button id="reading-journal-editor-close" type="button" aria-label="关闭">×</button>
          </header>
          <label>标题<input id="reading-journal-title" type="text" placeholder="例如：人物第一次出场" /></label>
          <label>原文或摘录<textarea id="reading-journal-quote" rows="3" placeholder="可选：记录对应的单词、句子或段落"></textarea></label>
          <label>Markdown 笔记<textarea id="reading-journal-content" rows="12" placeholder="支持 Markdown，可记录解释、翻译、感想或问题"></textarea></label>
          <label>标签<input id="reading-journal-tags" type="text" placeholder="用逗号分隔" /></label>
          <footer>
            <button id="reading-journal-editor-cancel" type="button">取消</button>
            <button class="primary-button" type="submit">保存札记</button>
          </footer>
        </form>
      </div>
