<section id="knowledge-base-page" class="knowledge-base-page" hidden aria-label="知识库页面">
        <div class="knowledge-base-shell">
          <aside class="knowledge-sidebar" aria-label="知识库导航">
            <button id="knowledge-base-back" class="knowledge-back-button knowledge-sidebar-back-only" type="button" aria-label="返回 PDF">← 返回 PDF</button>

            <div hidden aria-hidden="true">
              <button data-knowledge-filter="all" type="button"></button>
              <span id="knowledge-count-all"></span>
              <span id="knowledge-count-origin-novel"></span>
              <span id="knowledge-count-origin-novel-reading-card"></span>
              <span id="knowledge-count-origin-novel-note"></span>
              <span id="knowledge-count-origin-paper"></span>
              <span id="knowledge-count-origin-paper-reading-card"></span>
              <span id="knowledge-count-origin-paper-note"></span>
              <span id="knowledge-count-origin-general"></span>
              <span id="knowledge-count-origin-general-reading-card"></span>
              <span id="knowledge-count-origin-general-note"></span>
            </div>

            <nav class="knowledge-folder-nav" aria-label="知识库文件夹">
              <button id="knowledge-folder-all" class="active" type="button">
                <span><img src="/resources/all.svg" alt="" />全部 PDF</span><strong id="knowledge-library-count">0</strong>
              </button>
              <button id="knowledge-folder-unfiled" type="button">
                <span><img src="/resources/unfiled.svg" alt="" />未分类</span><strong id="knowledge-unfiled-count">0</strong>
              </button>
              <div class="knowledge-folder-heading">
                <span>阅读状态</span>
              </div>
              <button id="knowledge-filter-todo" type="button" data-reading-filter="todo">
                <span>待读</span><strong id="knowledge-reading-count-todo">0</strong>
              </button>
              <button id="knowledge-filter-reading" type="button" data-reading-filter="reading">
                <span>在读</span><strong id="knowledge-reading-count-reading">0</strong>
              </button>
              <button id="knowledge-filter-done" type="button" data-reading-filter="done">
                <span>已读</span><strong id="knowledge-reading-count-done">0</strong>
              </button>
              <div class="knowledge-folder-heading">
                <span>文件夹</span>
                <button id="knowledge-create-folder" type="button"><img src="/resources/new-window.svg" alt="" />新建</button>
              </div>
              <div id="knowledge-folder-list" class="knowledge-folder-list"></div>
            </nav>

            <section class="knowledge-sidebar-section" hidden>
              <div class="knowledge-sidebar-section-heading">
                <strong>分类</strong>
              </div>
              <div id="knowledge-category-list" class="knowledge-sidebar-list"></div>
            </section>

            <section class="knowledge-sidebar-section" hidden>
              <div class="knowledge-sidebar-section-heading">
                <strong>标签</strong>
              </div>
              <div id="knowledge-tag-list" class="knowledge-tag-cloud"></div>
            </section>

            <section class="knowledge-recent-card" hidden>
              <span>◷</span>
              <div>
                <strong>最近保存</strong>
                <p id="knowledge-recent-summary">还没有保存内容</p>
              </div>
            </section>
          </aside>

          <main class="knowledge-main">
            <header class="knowledge-main-header">
              <div>
                <h1 id="knowledge-page-title">知识库</h1>
                <p id="knowledge-page-subtitle">管理你主动添加的 PDF，并为跨文献问答提供全文检索。</p>
                <p class="knowledge-page-meta" hidden>共 <strong id="knowledge-total-count">0</strong> 条内容，来自 <strong id="knowledge-document-count">0</strong> 篇文档</p>
              </div>
              <div class="knowledge-main-actions">
                <button id="knowledge-refresh" type="button" hidden>↻ 刷新</button>
                <button id="knowledge-import" type="button" hidden>⇧ 导入笔记</button>
                <input id="knowledge-import-input" type="file" accept="application/json,.json" hidden />
                <button id="knowledge-batch-organize" type="button" hidden>▣ 批量整理</button>
                <button id="knowledge-new-note" class="primary-button" type="button" hidden>＋ 当前PDF添加到库</button>
              </div>
            </header>

            <div id="knowledge-library-view">
            <div class="knowledge-focus-tabs" role="tablist" aria-label="研究阅读快捷视图" hidden>
              <button class="active" data-knowledge-focus="all" type="button">全部</button>
              <button data-knowledge-focus="todo" type="button">待读 <strong id="knowledge-focus-count-todo">0</strong></button>
              <button data-knowledge-focus="deep" type="button">精读中 <strong id="knowledge-focus-count-deep">0</strong></button>
              <button data-knowledge-focus="finished" type="button">已读完 <strong id="knowledge-focus-count-finished">0</strong></button>
              <button data-knowledge-focus="citable" type="button">可引用 <strong id="knowledge-focus-count-citable">0</strong></button>
              <button data-knowledge-focus="replicate" type="button">待复现 <strong id="knowledge-focus-count-replicate">0</strong></button>
              <button data-knowledge-focus="related" type="button">相关工作 <strong id="knowledge-focus-count-related">0</strong></button>
              <button data-knowledge-focus="methods" type="button">方法灵感 <strong id="knowledge-focus-count-methods">0</strong></button>
            </div>

            <div class="knowledge-search-row research-search-row">
              <label class="knowledge-search-box">
                <svg class="knowledge-search-icon" aria-hidden="true"><use href="/resources/icons.svg#toolbar-icon-search" /></svg>
                <input id="knowledge-search-input" type="search" placeholder="搜索知识库中的 PDF…" />
              </label>
              <div class="knowledge-view-toggle" role="group" aria-label="视图">
                <button id="knowledge-view-list" class="active" type="button" aria-pressed="true">列表</button>
                <button id="knowledge-view-grid" type="button" aria-pressed="false">卡片</button>
              </div>
              <select id="knowledge-year-filter" aria-label="年份筛选" hidden>
                <option value="all">年份</option>
              </select>
              <select id="knowledge-venue-filter" aria-label="会议或期刊筛选" hidden>
                <option value="all">会议/期刊</option>
              </select>
              <select id="knowledge-reading-status-filter" aria-label="阅读状态筛选" hidden>
                <option value="all">阅读状态</option>
              </select>
              <select id="knowledge-priority-filter" aria-label="优先级筛选" hidden>
                <option value="all">优先级</option>
              </select>
              <button id="knowledge-clear-filters" type="button">清空搜索</button>
              <select id="knowledge-group-select" aria-label="分组方式" hidden>
                <option value="none">不分组</option>
                <option value="source">按来源文档</option>
                <option value="category">按分类</option>
              </select>
            </div>

            <div class="knowledge-filter-tabs" role="tablist" aria-label="知识库筛选" hidden>
              <button class="active" data-knowledge-filter="all" type="button">全部内容</button>
              <button data-knowledge-filter="note" type="button">笔记</button>
              <button data-knowledge-filter="reading-card" type="button">阅读卡片</button>
              <button data-knowledge-filter="paper-card" type="button">论文卡片</button>
            </div>

            <div id="knowledge-batch-bar" class="knowledge-batch-bar" aria-label="批量操作" hidden>
              <strong id="knowledge-batch-count">已选 0 篇</strong>
              <select id="knowledge-batch-folder" aria-label="目标文件夹"></select>
              <button id="knowledge-batch-move" type="button">移动到文件夹</button>
              <button id="knowledge-batch-related" type="button">检索相关论文</button>
              <button id="knowledge-batch-remove" class="danger-button" type="button">移出知识库</button>
              <button id="knowledge-batch-clear" type="button">取消选择</button>
            </div>

            <div id="knowledge-dashboard-metrics" class="knowledge-dashboard-metrics" aria-label="研究统计" hidden></div>
            <div id="knowledge-page-status" class="knowledge-page-status" hidden aria-live="polite"></div>
            <div id="knowledge-list" class="knowledge-card-grid" aria-live="polite"></div>
            <div id="knowledge-table-wrap" class="knowledge-table-wrap" hidden>
              <table class="knowledge-table">
                <thead>
                  <tr>
                    <th class="knowledge-col-select" scope="col">
                      <input id="knowledge-select-all" type="checkbox" aria-label="全选当前列表" />
                    </th>
                    <th class="knowledge-col-title" scope="col"><button type="button" data-knowledge-sort="title">标题</button></th>
                    <th class="knowledge-col-reading" scope="col"><button type="button" data-knowledge-sort="reading">阅读</button></th>
                    <th class="knowledge-col-pages" scope="col"><button type="button" data-knowledge-sort="pages">页数</button></th>
                    <th class="knowledge-col-date" scope="col"><button type="button" data-knowledge-sort="date">入库日期</button></th>
                    <th class="knowledge-col-published" scope="col"><button type="button" data-knowledge-sort="published">发表日期</button></th>
                    <th class="knowledge-col-state" scope="col"><button type="button" data-knowledge-sort="index">索引</button></th>
                    <th class="knowledge-col-state" scope="col"><button type="button" data-knowledge-sort="overview">概览</button></th>
                    <th class="knowledge-col-state" scope="col"><button type="button" data-knowledge-sort="related">相关</button></th>
                  </tr>
                </thead>
                <tbody id="knowledge-table-body"></tbody>
              </table>
              <p id="knowledge-table-empty" class="knowledge-table-empty" hidden>这个筛选下还没有 PDF。</p>
            </div>
            <p id="knowledge-list-summary" class="knowledge-list-summary"></p>

            <div class="knowledge-student-panels" hidden>
              <section class="knowledge-student-panel">
                <header class="knowledge-student-panel-header">
                  <strong>研究生阅读视角</strong>
                  <span>更贴近研究生做文献整理、引用与复现的真实需求</span>
                </header>
                <div id="knowledge-student-workbench" class="knowledge-student-workbench"></div>
              </section>
              <section class="knowledge-weekly-task-panel">
                <header class="knowledge-student-panel-header">
                  <strong>本周文献任务</strong>
                  <span>把阅读、引用整理与实验复现拆成可执行的小任务</span>
                </header>
                <div id="knowledge-weekly-tasks" class="knowledge-weekly-tasks"></div>
              </section>
            </div>
            </div>

          </main>

          <aside id="knowledge-detail-panel" class="knowledge-detail-panel knowledge-doc-panel" aria-label="文献详情" hidden>
            <header class="knowledge-detail-header">
              <strong id="knowledge-doc-title">选择一篇文献</strong>
              <button id="knowledge-detail-close" type="button" aria-label="关闭详情">×</button>
            </header>

            <div class="knowledge-doc-scroll">
              <div class="knowledge-doc-fields">
                <label class="knowledge-doc-field">
                  <span>文件夹</span>
                  <select id="knowledge-doc-folder"><option value="">未分类</option></select>
                </label>
                <label class="knowledge-doc-field">
                  <span>阅读状态</span>
                  <select id="knowledge-doc-reading">
                    <option value="todo">待读</option>
                    <option value="reading">在读</option>
                    <option value="done">已读</option>
                  </select>
                </label>
              </div>

              <dl class="knowledge-doc-meta">
                <div><dt>页数</dt><dd id="knowledge-doc-pages">—</dd></div>
                <div><dt>入库时间</dt><dd id="knowledge-doc-added">—</dd></div>
                <div><dt>更新时间</dt><dd id="knowledge-doc-updated">—</dd></div>
                <div><dt>片段数量</dt><dd id="knowledge-doc-chunks">—</dd></div>
              </dl>

              <section class="knowledge-doc-section">
                <h3>文献信息</h3>
                <dl class="knowledge-doc-biblio">
                  <div><dt>作者</dt><dd id="knowledge-doc-authors">—</dd></div>
                  <div><dt>出版日期</dt><dd id="knowledge-doc-publish-date">—</dd></div>
                  <div><dt>语言</dt><dd id="knowledge-doc-language">—</dd></div>
                  <div><dt>DOI</dt><dd id="knowledge-doc-doi">—</dd></div>
                  <div><dt>链接</dt><dd id="knowledge-doc-url">—</dd></div>
                </dl>
                <p id="knowledge-doc-metadata-note" class="knowledge-doc-note"></p>
                <button id="knowledge-doc-metadata" type="button">提取元数据</button>
              </section>

              <section class="knowledge-doc-section">
                <h3>处理状态</h3>
                <ul class="knowledge-doc-states">
                  <li><span>索引</span><strong id="knowledge-doc-index-state">—</strong></li>
                  <li><span>概览</span><strong id="knowledge-doc-overview-state">—</strong></li>
                  <li><span>相关论文</span><strong id="knowledge-doc-related-state">—</strong></li>
                </ul>
                <p id="knowledge-doc-issue" class="knowledge-doc-issue" hidden></p>
              </section>

              <section class="knowledge-doc-section">
                <h3>相关论文</h3>
                <p id="knowledge-doc-related-note" class="knowledge-doc-note"></p>
                <button id="knowledge-doc-search-related" type="button">检索相关论文</button>
              </section>

              <footer class="knowledge-doc-actions">
                <button id="knowledge-doc-overview" type="button">查看概览</button>
                <button id="knowledge-doc-open" type="button">打开原文</button>
                <button id="knowledge-doc-graph" type="button">在图谱中查看</button>
                <button id="knowledge-doc-remove" class="danger-button" type="button">移出知识库</button>
              </footer>
            </div>
          </aside>
        </div>
      </section>
