<div id="selection-context-menu" class="selection-context-menu" hidden>
      <button id="context-copy" class="context-menu-item" type="button">复制</button>
      <button id="context-clean-copy" class="context-menu-item" type="button">整理后复制</button>
      <div id="highlight-context-actions" class="highlight-context-actions" hidden>
        <button id="context-note" class="context-menu-item" type="button">添加笔记</button>
        <button id="context-delete-highlight" class="context-menu-item danger" type="button" hidden>删除高亮</button>
      </div>
      <div id="context-colors" class="quick-colors" aria-label="高亮颜色">
        <button type="button" data-quick-highlight-color-history-index="0" aria-label="最近颜色 1"></button>
        <button type="button" data-quick-highlight-color-history-index="1" aria-label="最近颜色 2"></button>
        <button type="button" data-quick-highlight-color-history-index="2" aria-label="最近颜色 3"></button>
      </div>
    </div>

    <div id="recent-files-dialog" class="modal-backdrop" hidden>
      <section class="recent-files-panel" role="dialog" aria-modal="true" aria-labelledby="recent-files-title">
        <header>
          <strong id="recent-files-title">最近打开</strong>
          <button id="close-recent-files" type="button" aria-label="关闭">×</button>
        </header>
        <div id="recent-files-list" class="recent-files-list"></div>
        <footer>
          <button id="clear-recent-files" type="button">清空记录</button>
        </footer>
      </section>
    </div>

    <div id="translation-history-dialog" class="modal-backdrop" hidden>
      <section class="translation-history-panel" role="dialog" aria-modal="true" aria-labelledby="translation-history-dialog-title">
        <header>
          <div>
            <strong id="translation-history-dialog-title">英语学习历史</strong>
            <span id="translation-history-dialog-count">0 条记录</span>
          </div>
          <div class="translation-history-dialog-actions">
            <button id="clear-translation-history" class="translation-history-clear" type="button" hidden>清空记录</button>
            <button id="close-translation-history" type="button" aria-label="关闭">×</button>
          </div>
        </header>
        <div class="translation-history-search">
          <input id="translation-history-search" type="search" autocomplete="off" placeholder="搜索单词、原句或释义" aria-label="搜索英语学习历史" />
        </div>
        <div id="translation-history-dialog-list" class="translation-history-dialog-list"></div>
      </section>
    </div>


    <div id="knowledge-editor-dialog" class="modal-backdrop knowledge-editor-backdrop" hidden>
      <form
        id="knowledge-editor-form"
        class="knowledge-editor-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="knowledge-editor-heading"
      >
        <header class="knowledge-editor-header">
          <div class="knowledge-editor-heading-group">
            <div class="knowledge-editor-page-icon" aria-hidden="true">▧</div>
            <div>
              <strong id="knowledge-editor-heading">新建笔记</strong>
              <p id="knowledge-editor-source">保存到本地知识库</p>
            </div>
          </div>

          <div class="knowledge-editor-header-actions">
            <button id="knowledge-editor-open-source" type="button">查看原文</button>
            <button id="knowledge-editor-close" class="knowledge-editor-close-button" type="button" aria-label="关闭">×</button>
          </div>
        </header>

        <div class="knowledge-editor-workspace">
          <main class="knowledge-editor-document">
            <section class="knowledge-editor-title-card">
              <label>
                <span>笔记标题</span>
                <input
                  id="knowledge-editor-title"
                  type="text"
                  maxlength="160"
                  placeholder="输入一个清晰、可检索的笔记标题"
                />
              </label>
            </section>

            <section class="knowledge-editor-body-card">
              <div class="knowledge-editor-section-heading">
                <div>
                  <strong id="knowledge-editor-body-mode-label">排版正文</strong>
                  <span>原文、翻译、重点词汇与 LaTeX 公式会自动整理</span>
                </div>
                <button
                  id="knowledge-editor-mode-toggle"
                  class="knowledge-editor-mode-toggle"
                  type="button"
                >编辑正文</button>
              </div>

              <div class="knowledge-editor-body-workspace knowledge-editor-single-workspace">
                <div
                  id="knowledge-editor-edit-pane"
                  class="knowledge-editor-body-label knowledge-editor-edit-pane"
                  hidden
                >
                  <label class="knowledge-editor-textarea-label">
                  <span class="sr-only">编辑正文</span>
                  <textarea
                    id="knowledge-editor-body"
                    rows="20"
                    placeholder="建议结构：

原文
记录论文原文、页码和关键公式。

翻译
写下准确、通顺的中文翻译。

重点词汇
- oblivious：不经意的
- programmable：可编程的

我的判断
说明这段内容为什么重要。

公式可使用：
$F(k,q_i)$
或
$$
F(x)=\sum_{i=1}^{n} w_i x_i
$$"
                  ></textarea>
                  </label>
                  <footer class="knowledge-editor-edit-actions">
                    <button id="knowledge-editor-cancel" type="button">取消编辑</button>
                    <button id="knowledge-editor-delete" class="knowledge-editor-delete-button" type="button" hidden>删除</button>
                    <button class="primary-button knowledge-editor-save-button" type="submit">保存修改</button>
                  </footer>
                </div>

                <section
                  id="knowledge-editor-preview-pane"
                  class="knowledge-editor-preview-pane knowledge-editor-single-preview"
                  aria-label="笔记排版正文"
                >
                  <div
                    id="knowledge-editor-preview"
                    class="knowledge-editor-preview chat-markdown"
                    aria-live="polite"
                  ></div>
                </section>
              </div>
            </section>
          </main>

          <aside class="knowledge-editor-sidebar">
            <section class="knowledge-editor-side-card">
              <header>
                <strong>知识属性</strong>
                <span>便于后续检索和跨文献整理</span>
              </header>

              <div class="knowledge-editor-fields">
                <label>
                  <span>分类</span>
                  <input
                    id="knowledge-editor-category"
                    type="text"
                    maxlength="60"
                    placeholder="例如：安全多方计算 / 密码学协议"
                  />
                </label>

                <label>
                  <span>标签</span>
                  <input
                    id="knowledge-editor-tags"
                    type="text"
                    maxlength="240"
                    placeholder="例如：OPRF, PSI, 复现"
                  />
                  <small>多个标签使用逗号分隔</small>
                </label>
              </div>
            </section>

            <section class="knowledge-editor-side-card knowledge-editor-source-card">
              <header>
                <strong>原文位置</strong>
                <span>用于返回 PDF 中对应的上下文</span>
              </header>
              <div class="knowledge-editor-guidance">
                <p><strong>文件：</strong><span id="knowledge-editor-source-document">未关联文档</span></p>
                <p><strong>位置：</strong><span id="knowledge-editor-source-position">未记录位置</span></p>
                <p><strong>原句：</strong><span id="knowledge-editor-source-quote">未记录原句</span></p>
              </div>
            </section>

            <section class="knowledge-editor-side-card knowledge-editor-tip-card">
              <strong>研究生笔记建议</strong>
              <ul>
                <li>只保留能支持研究决策的信息。</li>
                <li>把结论和证据放在一起。</li>
                <li>明确下一次阅读或实验动作。</li>
              </ul>
            </section>
          </aside>
        </div>
      </form>
    </div>

    <aside id="highlight-note-popover" class="highlight-note-popover" hidden>
      <header>
        <strong id="highlight-note-title" hidden>高亮笔记</strong>
        <button id="close-highlight-note" type="button" aria-label="关闭笔记" title="关闭">×</button>
      </header>
      <p id="highlight-note-quote" hidden></p>
      <textarea id="highlight-note-text" rows="4" aria-label="笔记内容" placeholder="写下你的笔记…"></textarea>
      <footer>
        <button id="delete-highlight-note" type="button" hidden>删除笔记</button>
        <button id="save-highlight-note" type="button" aria-label="保存笔记" title="保存">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m4 10 4 4 8-9" />
          </svg>
        </button>
      </footer>
    </aside>

    <div id="annotation-action-bar" class="annotation-action-bar" hidden>
      <span id="annotation-type-label">批注</span>
      <label id="free-text-size-control" class="free-text-size-control" title="文本字号" hidden>
        <span>字号</span>
        <button id="free-text-size-down" type="button" title="缩小文本">A-</button>
        <input id="free-text-size" type="number" min="4" max="72" step="1" value="16" />
        <button id="free-text-size-up" type="button" title="放大文本">A+</button>
        <input id="free-text-color" class="free-text-color-input" type="color" value="#000000" title="文本颜色" />
      </label>
      <button id="delete-annotation" type="button" title="删除批注（Delete）">删除</button>
    </div>

    <form id="find-bar" class="find-bar" hidden>
      <input id="find-input" type="search" placeholder="在PDF中查找" autocomplete="off" />
      <span id="find-count" aria-live="polite">0/0</span>
      <button id="find-previous" type="button" title="上一个">↑</button>
      <button id="find-next" type="button" title="下一个">↓</button>
      <button id="find-close" type="button" title="关闭">×</button>
    </form>

    <div id="settings-modal-backdrop" class="settings-modal-backdrop" hidden aria-hidden="true"></div>

    <dialog
      id="app-error-dialog"
      class="app-confirm-dialog app-error-dialog"
      aria-labelledby="app-error-dialog-title"
    >
      <section class="app-confirm-dialog-card">
        <header>
          <div class="app-confirm-dialog-icon" aria-hidden="true">!</div>
          <div>
            <h2 id="app-error-dialog-title">出错了</h2>
            <p id="app-error-dialog-summary"></p>
          </div>
          <button id="app-error-dialog-close" class="app-confirm-dialog-close" type="button" aria-label="关闭">×</button>
        </header>
        <div id="app-error-dialog-message" class="app-error-dialog-message" role="document" tabindex="0"></div>
        <footer>
          <button id="app-error-dialog-copy" type="button">复制错误信息</button>
          <button id="app-error-dialog-dismiss" type="button" class="primary-button">知道了</button>
        </footer>
      </section>
    </dialog>

    <dialog
      id="translation-preference-dialog"
      class="app-confirm-dialog translation-preference-dialog"
      aria-labelledby="translation-preference-dialog-title"
    >
      <section class="app-confirm-dialog-card">
        <header>
          <div class="app-confirm-dialog-icon" aria-hidden="true">译</div>
          <div>
            <h2 id="translation-preference-dialog-title">添加翻译偏好</h2>
            <p>术语可以在译文中保留英文原文，或按场景指定不同译法。</p>
          </div>
          <button id="translation-preference-cancel" class="app-confirm-dialog-close" type="button" aria-label="关闭">×</button>
        </header>
        <form id="translation-preference-form">
          <label class="settings-field">
            <span>术语（英文原文）</span>
            <input id="translation-preference-term" type="text" autocomplete="off" spellcheck="false" placeholder="例如 Transformer、field" required />
          </label>
          <label class="settings-field">
            <span>规则类型</span>
            <select id="translation-preference-kind">
              <option value="keep">译文保留英文原文，不翻译</option>
              <option value="contextual">按场景指定译法</option>
            </select>
          </label>
          <div id="translation-preference-contextual-fields" class="translation-preference-contextual" hidden>
            <label class="settings-field">
              <span>默认译法（其他场景）</span>
              <input id="translation-preference-default" type="text" autocomplete="off" spellcheck="false" placeholder="例如 领域" />
            </label>
            <label class="settings-field">
              <span>场景关键词（逗号分隔，中英文皆可）</span>
              <input id="translation-preference-context-terms" type="text" autocomplete="off" spellcheck="false" placeholder="例如 电路、电磁、electric、circuit" />
            </label>
            <label class="settings-field">
              <span>该场景下的译法</span>
              <input id="translation-preference-context-translation" type="text" autocomplete="off" spellcheck="false" placeholder="例如 电路" />
            </label>
          </div>
        </form>
        <footer>
          <button type="button" data-close-dialog="translation-preference-dialog">取消</button>
          <button id="translation-preference-save" type="submit" form="translation-preference-form" class="primary-button">保存</button>
        </footer>
      </section>
    </dialog>

    <dialog
      id="translation-preference-suggestions-dialog"
      class="app-confirm-dialog translation-preference-dialog"
      aria-labelledby="translation-preference-suggestions-title"
    >
      <section class="app-confirm-dialog-card">
        <header>
          <div class="app-confirm-dialog-icon" aria-hidden="true">AI</div>
          <div>
            <h2 id="translation-preference-suggestions-title">AI 翻译偏好建议</h2>
            <p>勾选要保存到长期记忆的术语规则。</p>
          </div>
          <button id="translation-preference-suggestions-cancel" class="app-confirm-dialog-close" type="button" aria-label="关闭">×</button>
        </header>
        <div id="translation-preference-suggestions" class="translation-preference-suggestions"></div>
        <footer>
          <button type="button" data-close-dialog="translation-preference-suggestions-dialog">取消</button>
          <button id="translation-preference-suggestions-save" type="button" class="primary-button">保存选中</button>
        </footer>
      </section>
    </dialog>
