<dialog id="knowledge-folder-dialog" class="knowledge-folder-dialog" aria-labelledby="knowledge-folder-dialog-title">
  <form id="knowledge-folder-form" method="dialog">
    <header>
      <div class="knowledge-folder-dialog-icon"><img src="/resources/folder.svg" alt="" /></div>
      <div>
        <h2 id="knowledge-folder-dialog-title">新建文件夹</h2>
        <p>选择上级目录，即可像真实文件夹一样建立多层结构。</p>
      </div>
      <button id="knowledge-folder-dialog-close" class="knowledge-folder-dialog-close" type="button" aria-label="关闭">×</button>
    </header>
    <label>
      <span>文件夹名称</span>
      <input id="knowledge-folder-name-input" type="text" maxlength="80" autocomplete="off" placeholder="例如：GNN / 论文方法" required />
    </label>
    <label>
      <span>上级文件夹</span>
      <select id="knowledge-folder-parent-select">
        <option value="">知识库根目录</option>
      </select>
    </label>
    <footer>
      <button id="knowledge-folder-dialog-cancel" type="button">取消</button>
      <button class="primary-button" type="submit">创建文件夹</button>
    </footer>
  </form>
</dialog>

<dialog id="knowledge-overview-dialog" class="knowledge-overview-dialog app-motion-dialog" aria-labelledby="knowledge-overview-title">
  <div class="knowledge-overview-shell">
    <header>
      <div>
        <span>AI 生成 · 支持编辑</span>
        <h2 id="knowledge-overview-title">PDF 概览</h2>
        <p id="knowledge-overview-document-name"></p>
      </div>
      <div class="knowledge-overview-header-actions">
        <button id="knowledge-overview-open-source" type="button">打开原文</button>
        <button id="knowledge-overview-close" type="button" aria-label="关闭 PDF 概览">×</button>
      </div>
    </header>
    <div id="knowledge-overview-status" class="knowledge-overview-status" hidden></div>
    <div class="knowledge-overview-body">
      <article id="knowledge-overview-content" class="knowledge-overview-content"></article>
      <div id="knowledge-overview-editor" class="knowledge-overview-editor" hidden>
        <label for="knowledge-overview-markdown">编辑概览内容（Markdown）</label>
        <textarea id="knowledge-overview-markdown" spellcheck="false" placeholder="在这里补充或修改 PDF 概览…"></textarea>
        <p>支持标题、列表和表格。预览确认后点击“保存修改”。</p>
      </div>
    </div>    <footer>
      <button id="knowledge-overview-regenerate" type="button">重新生成</button>
      <button id="knowledge-overview-edit" type="button">编辑内容</button>
      <button id="knowledge-overview-preview" type="button" hidden>预览排版</button>
      <button id="knowledge-overview-cancel-edit" type="button" hidden>取消编辑</button>
      <button id="knowledge-overview-save" class="primary-button" type="button" hidden>保存修改</button>
      <button id="knowledge-overview-done" class="primary-button" type="button">完成</button>
    </footer>
  </div>
</dialog>

<!--
  数据体检：只读地找出「记录说一套、实际数据另一套」的地方，逐条给修复动作。没有「一键全修」——每一条修复都是
  一个明确的操作，有的还会花模型调用，所以必须一条一条确认。
-->
<dialog id="knowledge-data-health-dialog" class="knowledge-data-health-dialog app-motion-dialog" aria-labelledby="knowledge-data-health-title">
  <div class="knowledge-data-health-shell">
    <header>
      <div>
        <span>只读体检 · 逐条修复</span>
        <h2 id="knowledge-data-health-title">数据体检</h2>
        <p id="knowledge-data-health-summary"></p>
      </div>
      <button id="knowledge-data-health-close" type="button" aria-label="关闭数据体检">×</button>
    </header>
    <div id="knowledge-data-health-list" class="knowledge-data-health-list"></div>
    <div id="knowledge-data-health-status" class="knowledge-data-health-status" hidden></div>
    <footer>
      <button id="knowledge-data-health-rescan" type="button">重新体检</button>
      <button id="knowledge-data-health-done" class="primary-button" type="button">完成</button>
    </footer>
  </div>
</dialog>

<!--
  复制引用：四种格式都是纯函数生成的，这里只负责展示与复制。缺项写在文本下面而不是藏起来——一条没有作者和年份的引文
  贴进论文就是事故，复制之前应当看得见。
-->
<dialog id="knowledge-citation-dialog" class="knowledge-citation-dialog app-motion-dialog" aria-labelledby="knowledge-citation-heading">
  <div class="knowledge-citation-shell">
    <header>
      <div>
        <span>引文 · 缺什么就空着什么</span>
        <h2 id="knowledge-citation-heading">复制引用</h2>
        <p id="knowledge-citation-document"></p>
      </div>
      <button id="knowledge-citation-close" type="button" aria-label="关闭引文">×</button>
    </header>
    <div id="knowledge-citation-styles" class="knowledge-citation-styles" role="tablist" aria-label="引文格式"></div>
    <pre id="knowledge-citation-text" class="knowledge-citation-text"></pre>
    <div id="knowledge-citation-warnings" class="knowledge-citation-warnings" hidden></div>
    <footer>
      <span id="knowledge-citation-status" class="knowledge-citation-status" aria-live="polite"></span>
      <div class="knowledge-citation-actions">
        <button id="knowledge-citation-done" type="button">完成</button>
        <button id="knowledge-citation-copy" class="primary-button" type="button">复制</button>
      </div>
    </footer>
  </div>
</dialog>
