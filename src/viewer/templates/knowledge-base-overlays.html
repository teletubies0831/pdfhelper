<dialog id="knowledge-folder-dialog" class="knowledge-folder-dialog" aria-labelledby="knowledge-folder-dialog-title">
  <form id="knowledge-folder-form" method="dialog">
    <header>
      <div class="knowledge-folder-dialog-icon"><img src="/resources/folder.svg" alt="" /></div>
      <div>
        <h2 id="knowledge-folder-dialog-title">新建文件夹</h2>
        <p>选择上级目录，即可像真实文件夹一样建立多层结构。</p>
      </div>
      <button id="knowledge-folder-dialog-close" class="knowledge-folder-dialog-close" type="button" aria-label="关闭">×</button>
    </header>
    <label>
      <span>文件夹名称</span>
      <input id="knowledge-folder-name-input" type="text" maxlength="80" autocomplete="off" placeholder="例如：GNN / 论文方法" required />
    </label>
    <label>
      <span>上级文件夹</span>
      <select id="knowledge-folder-parent-select">
        <option value="">知识库根目录</option>
      </select>
    </label>
    <footer>
      <button id="knowledge-folder-dialog-cancel" type="button">取消</button>
      <button class="primary-button" type="submit">创建文件夹</button>
    </footer>
  </form>
</dialog>

<dialog id="knowledge-overview-dialog" class="knowledge-overview-dialog app-motion-dialog" aria-labelledby="knowledge-overview-title">
  <div class="knowledge-overview-shell">
    <header>
      <div>
        <span>AI 生成并保存</span>
        <h2 id="knowledge-overview-title">PDF 概览</h2>
        <p id="knowledge-overview-document-name"></p>
      </div>
      <div class="knowledge-overview-header-actions">
        <button id="knowledge-overview-open-source" type="button">打开原文</button>
        <button id="knowledge-overview-close" type="button" aria-label="关闭 PDF 概览">×</button>
      </div>
    </header>
    <div id="knowledge-overview-status" class="knowledge-overview-status" hidden></div>
    <article id="knowledge-overview-content" class="knowledge-overview-content"></article>
    <footer>
      <button id="knowledge-overview-regenerate" type="button">重新生成</button>
      <button id="knowledge-overview-done" class="primary-button" type="button">完成</button>
    </footer>
  </div>
</dialog>
